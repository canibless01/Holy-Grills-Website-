<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF4E2D" />
    <title>Holy Grill — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #FFF5F0 0%, #FFE6D9 100%);
        color: #321B11;
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .card { max-width: 420px; }
      .flame { font-size: 72px; margin-bottom: 16px; }
      h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
      p { font-size: 16px; color: #6B4A2E; line-height: 1.6; margin-bottom: 24px; }
      button {
        background: linear-gradient(135deg, #FF9500 0%, #FF4E2D 100%);
        color: #fff; border: none; border-radius: 9999px;
        padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer;
        box-shadow: 0 8px 24px rgba(255,78,45,0.3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="flame">🔥</div>
      <h1>You're offline</h1>
      <p>The grill's still hot — we just can't reach it right now. Check your connection and try again.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
